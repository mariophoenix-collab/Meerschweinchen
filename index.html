<style>
/* Layout: Seitenleiste (Desktop) bzw. Tab-Leiste (Handy), Inhalt als ruhige Karten-Spalte.
   Farbwelt: Wiese und Heu – Moosgrün für Aktionen, Heugelb als kleiner Akzent. */
:root {
  --bg: #f3f5ef; --surface: #ffffff; --surface-2: #e9ede4; --ink: #1d2721; --muted: #5d6a61;
  --line: #d9dfd3; --moss: #2e6a4c; --moss-ink: #ffffff; --hay: #c98f17; --hay-soft: #f6e8c6;
  --ok: #2f7d4f; --warn: #b7791f; --crit: #b83a2e; --info: #3a6f95;
  --ok-bg: #e3f1e7; --warn-bg: #fbefd9; --crit-bg: #f8e1de; --info-bg: #e2edf5;
  --chart-1: #2e6a4c; --chart-2: #c98f17; --chart-3: #3a6f95; --chart-4: #9a4f7c; --chart-5: #6b7f2a;
  --grass: #d3e6c6; --grass-d: #5f8f4e; --hay-d: #b98522; --fur-a: #c9853d; --fur-b: #f7eedf; --fur-c: #5b3a22; --ear: #eaa797;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px; --r-sm: 9px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121814; --surface: #1a221d; --surface-2: #232d27; --ink: #e8eee9; --muted: #9aa89f;
  --line: #2f3b34; --moss: #5fae84; --moss-ink: #0e1a13; --hay: #e2ad3f; --hay-soft: #3a3020;
  --ok: #6cc28f; --warn: #e3a948; --crit: #f07a6c; --info: #7fb2d8;
  --ok-bg: #1c3326; --warn-bg: #3a2e18; --crit-bg: #3d211d; --info-bg: #1b2d3b;
  --chart-1: #6cc28f; --chart-2: #e2ad3f; --chart-3: #7fb2d8; --chart-4: #d48bb8; --chart-5: #b5c95a;
  --grass: #263b29; --grass-d: #77ad62; --hay-d: #c99530; --fur-a: #c98a45; --fur-b: #efe3cf; --fur-c: #4a2f1c; --ear: #d98f80;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1a221d; --surface-2: #232d27; --ink: #e8eee9; --muted: #9aa89f;
  --line: #2f3b34; --moss: #5fae84; --moss-ink: #0e1a13; --hay: #e2ad3f; --hay-soft: #3a3020;
  --ok: #6cc28f; --warn: #e3a948; --crit: #f07a6c; --info: #7fb2d8;
  --ok-bg: #1c3326; --warn-bg: #3a2e18; --crit-bg: #3d211d; --info-bg: #1b2d3b;
  --chart-1: #6cc28f; --chart-2: #e2ad3f; --chart-3: #7fb2d8; --chart-4: #d48bb8; --chart-5: #b5c95a;
  --grass: #263b29; --grass-d: #77ad62; --hay-d: #c99530; --fur-a: #c98a45; --fur-b: #efe3cf; --fur-c: #4a2f1c; --ear: #d98f80;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.65rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--moss); }
:focus-visible { outline: 3px solid var(--hay); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* Rahmen */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.side { display: none; }
.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 110px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand .logo { width: 38px; height: 38px; border-radius: 12px; object-fit: cover; flex: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.top .grow { flex: 1 1 200px; min-width: 0; }
.search { width: 100%; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar button { background: none; border: 0; padding: 6px 2px; display: grid; justify-items: center; gap: 2px; font-size: .74rem; color: var(--muted); border-radius: 10px; cursor: pointer; min-height: 52px; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--moss); font-weight: 700; }
@media (min-width: 900px) {
  .shell { grid-template-columns: 236px 1fr; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
  .side .brand { padding: 4px 10px 18px; }
  .side button { display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--ink); }
  .side button svg { width: 20px; height: 20px; color: var(--muted); }
  .side button[aria-current="page"] { background: var(--surface-2); font-weight: 700; }
  .side button[aria-current="page"] svg { color: var(--moss); }
  .side .foot { margin-top: auto; font-size: .8rem; color: var(--muted); padding: 10px 12px; }
  .tabbar { display: none; }
  .main { padding-block: 24px 48px; }
  .top .brand { display: none; }
}

/* Bausteine */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card > h2, .card > .head { margin-bottom: 12px; }
h2 svg { width: 20px; height: 20px; vertical-align: -3px; color: var(--moss); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.grid-2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent; background: var(--moss); color: var(--moss-ink); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--crit); color: #fff; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: .9rem; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .55; cursor: default; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: .88rem; cursor: pointer; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--moss); color: var(--moss-ink); border-color: var(--moss); font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); } .pill.info { background: var(--info-bg); color: var(--info); }
.pill.ex { background: var(--hay-soft); color: var(--hay); }

.alert { display: grid; grid-template-columns: 6px 1fr; gap: 12px; padding: 12px 14px 12px 0; border-radius: var(--r-sm); background: var(--surface-2); }
.alert::before { content: ""; border-radius: 0 4px 4px 0; background: var(--muted); }
.alert.crit { background: var(--crit-bg); } .alert.crit::before { background: var(--crit); }
.alert.warn { background: var(--warn-bg); } .alert.warn::before { background: var(--warn); }
.alert.info { background: var(--info-bg); } .alert.info::before { background: var(--info); }
.alert.ok { background: var(--ok-bg); } .alert.ok::before { background: var(--ok); }
.alert strong { display: block; }

.pig { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.pig:hover { border-color: var(--moss); }
.avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); overflow: hidden; }
.avatar.lg { width: 96px; height: 96px; }
.avatar svg { width: 60%; height: 60%; }
.big { font-family: var(--font-data); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.trend { font-size: .85rem; font-family: var(--font-data); }

.list { display: grid; }
.list > .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.list > .item:first-child { border-top: 0; }
.item .t { font-weight: 700; }
.item .meta { font-size: .85rem; color: var(--muted); }
.item.click { cursor: pointer; }
.item.click:hover .t { color: var(--moss); }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 12px; justify-items: center; }

/* Diagramme */
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 320px; }
.chart text { fill: var(--muted); font: 11px var(--font-data); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart circle { cursor: pointer; }
.tip { min-height: 1.5em; font-size: .9rem; color: var(--muted); margin-top: 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Formulare (Blatt) */
.sheet { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 45%, transparent); display: grid; align-items: end; justify-items: center; }
.sheet .panel { background: var(--bg); width: min(720px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
@media (min-width: 760px) { .sheet { align-items: center; } .sheet .panel { border-radius: 20px; max-height: 88vh; } }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-weight: 700; font-size: .92rem; }
.field .hint { font-size: .82rem; color: var(--muted); }
.field input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), .field select, .field textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.field textarea { min-height: 88px; resize: vertical; }
.field input.weight { font-family: var(--font-data); font-size: 1.4rem; }
.fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.fieldset legend { padding: 0 6px; font-weight: 700; font-family: var(--font-display); }
.checks { display: flex; gap: 8px; flex-wrap: wrap; }
.checks label { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 400; cursor: pointer; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img, .thumbs video { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
.gallery { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); }
.gallery figure { margin: 0; display: grid; gap: 4px; }
.gallery img, .gallery video { width: 100%; aspect-ratio: 1; max-width: 100%; object-fit: cover; border-radius: 12px; background: var(--surface-2); }
.gallery figcaption { font-size: .8rem; color: var(--muted); }
.items-table { display: grid; gap: 8px; }
.items-table .r { display: grid; grid-template-columns: 1fr 110px 40px; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
@media (min-width: 900px) { .toast { bottom: 24px; } }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-color: var(--moss); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { font-size: .75rem; color: var(--muted); text-align: center; padding: 4px 0; }
.cal button { aspect-ratio: 1; min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; display: grid; place-items: center; gap: 0; padding: 2px; position: relative; font-family: var(--font-data); }
.cal button.out { opacity: .4; }
.cal button.today { border-color: var(--moss); border-width: 2px; }
.cal button[aria-pressed="true"] { background: var(--moss); color: var(--moss-ink); }
.cal .dots { display: flex; gap: 2px; height: 6px; }
.cal .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--hay); }
.kv { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 6px 14px; font-size: .95rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.bars { display: grid; gap: 8px; }
.bars .b { display: grid; grid-template-columns: minmax(90px, 30%) 1fr auto; gap: 10px; align-items: center; font-size: .9rem; }
.bars .track { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bars .fill { height: 100%; background: var(--moss); border-radius: 6px; }
.notice { font-size: .82rem; color: var(--muted); }


table.cmp { border-collapse: collapse; width: 100%; min-width: 420px; font-size: .92rem; }
table.cmp th, table.cmp td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.cmp thead th { font-family: var(--font-display); font-size: 1rem; white-space: nowrap; }
table.cmp tbody th { color: var(--muted); font-weight: 400; white-space: nowrap; }
table.cmp .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 280px); gap: 8px 20px; align-items: end; background: linear-gradient(170deg, var(--surface) 30%, var(--grass)); border: 1px solid var(--line); border-radius: 20px; padding: 22px 22px 0; overflow: hidden; }
.hero-text { display: grid; gap: 16px; padding-bottom: 22px; min-width: 0; }
.hero-art svg, .welcome-art svg, .foot-art svg { display: block; width: 100%; height: auto; }
.hero-art { margin-bottom: -4px; }
@media (max-width: 600px) { .hero { grid-template-columns: 1fr; } .hero-art { order: -1; width: min(220px, 70%); justify-self: center; margin-bottom: -10px; } .hero-text { padding-bottom: 20px; } }
.welcome { background: linear-gradient(175deg, var(--surface) 35%, var(--grass)); border: 1px solid var(--line); border-radius: 22px; padding: 28px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.welcome-art { width: min(340px, 86%); }
.welcome h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); }
.welcome p { max-width: 52ch; color: var(--muted); }
.foot-art { display: grid; justify-items: center; gap: 4px; margin-top: 26px; text-align: center; }
.foot-art .art { width: 150px; opacity: .95; }
.foot-art .notice { max-width: 62ch; }
@media (prefers-reduced-motion: no-preference) { .sheet .panel { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(14px); opacity: .6; } } }

/* ---- iPad, iPhone und Touch ---- */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { overflow-x: clip; }
* { -webkit-tap-highlight-color: transparent; }
button, a, label, .chip, .item.click, [data-act] { touch-action: manipulation; }
body { -webkit-user-select: auto; overscroll-behavior-y: none; }
.main { padding-top: max(12px, env(safe-area-inset-top, 0px)); }
.side { padding-top: max(20px, env(safe-area-inset-top, 0px)) !important; padding-left: max(14px, env(safe-area-inset-left, 0px)) !important; }
.chart svg { min-width: 0; }
.chart text { font-size: 12px; }
.side .brand span { font-size: 1.05rem; line-height: 1.15; }
.top .brand span { font-size: 1.05rem; line-height: 1.15; }
@media (pointer: coarse) {
  .chip { min-height: 44px; padding: 8px 14px; font-size: .95rem; }
  .btn.sm { min-height: 44px; padding: 8px 14px; }
  .tabs button { min-height: 50px; padding: 12px 16px; }
  .cal button { min-height: 46px; }
  .checks label { min-height: 44px; padding: 10px 14px; }
  .side button { min-height: 48px; }
  .list > .item { padding: 14px 0; }
  .chart circle { stroke-width: 3; }
}
/* iPad hochkant: etwas mehr Luft und zweispaltige Raster */
@media (min-width: 740px) and (max-width: 899px) {
  .main { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .tabbar button { font-size: .82rem; }
}
.syncpill { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: .88rem; white-space: nowrap; }
.syncpill i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.syncpill[data-s="ok"] i { background: var(--ok); }
.syncpill[data-s="syncing"] i { background: var(--info); animation: pulse 1s ease-in-out infinite; }
.syncpill[data-s="offline"] i, .syncpill[data-s="needs-login"] i { background: var(--warn); }
.syncpill[data-s="error"] i { background: var(--crit); }
@keyframes pulse { 50% { opacity: .35; } }
@media (max-width: 520px) { .syncpill span { display: none; } .syncpill { padding: 6px 12px; } }
.side .syncpill { margin: 6px 4px 0; justify-content: flex-start; white-space: normal; text-align: left; }
.toast { display: flex; align-items: center; gap: 14px; }
.toast button { background: none; border: 0; color: var(--hay); font-weight: 700; min-height: 36px; padding: 0 4px; cursor: pointer; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.steps li::marker { font-weight: 700; color: var(--moss); }
.kbd { display: inline-block; padding: 1px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); font-size: .9em; }
.files .item .t { overflow-wrap: anywhere; }

// ---------------- Illustration (eigene Zeichnung) ----------------
function pigArt(sleep = false) {
  const blades = (xs) => xs.map(([x, h, lean]) => `<path d="M${x} 178 q${lean} ${-h / 2} ${lean * 1.6} ${-h}" stroke="var(--grass-d)" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('');
  const hay = (n, y0) => Array.from({ length: n }, (_, i) => { const x = 40 + i * 21 + (i % 3) * 5, y = y0 + (i % 4) * 3; return `<path d="M${x} ${y} q${18 + (i % 5) * 3} ${-10 - (i % 3) * 4} ${38 + (i % 4) * 4} ${-2 + (i % 2) * 6}" stroke="${i % 3 ? 'var(--hay)' : 'var(--hay-d)'}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`; }).join('');
  const eye = sleep
    ? '<path d="M225 104q7 6 14 0" stroke="var(--fur-c)" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : '<circle cx="233" cy="102" r="6.5" fill="var(--fur-c)"/><circle cx="235.5" cy="99.5" r="2.2" fill="#fff"/>';

const WMO = { 0: 'klar', 1: 'überwiegend klar', 2: 'teilweise bewölkt', 3: 'bedeckt', 45: 'Nebel', 48: 'Raureif-Nebel', 51: 'leichter Niesel', 53: 'Niesel', 55: 'starker Niesel', 56: 'gefrierender Niesel', 57: 'gefrierender Niesel', 61: 'leichter Regen', 63: 'Regen', 65: 'starker Regen', 66: 'gefrierender Regen', 67: 'gefrierender Regen', 71: 'leichter Schneefall', 73: 'Schneefall', 75: 'starker Schneefall', 77: 'Schneegriesel', 80: 'Regenschauer', 81: 'Regenschauer', 82: 'heftige Regenschauer', 85: 'Schneeschauer', 86: 'starke Schneeschauer', 95: 'Gewitter', 96: 'Gewitter mit Hagel', 99: 'Gewitter mit Hagel' };
const wmo = (c) => WMO[c] ?? '–';
const compass = (d) => (d == null ? '' : ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'][Math.round(((+d % 360) + 360) % 360 / 45) % 8]);
const WX = {
  data: null, at: 0, err: '', loading: false,
  async geocode(q) {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=de&countryCode=CH&format=json`);
    if (!r.ok) throw new Error('Ortssuche nicht erreichbar');
    return (await r.json()).results || [];
  },
  restore() { try { const c = JSON.parse(localStorage.getItem('cavia-wx') || 'null'); if (c && c.key === this.key()) { this.data = c.data; this.at = c.at; } } catch {} },
  key() { const s = settings(); return `${s.wxLat},${s.wxLon}`; },
  async load(force) {
    const s = settings(); if (!STANDALONE || !s.wxLat) return;
    if (!force && this.data && Date.now() - this.at < 30 * 60000) return;
    this.loading = true;
    try {
      const hourly = 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m';
      const p = new URLSearchParams({ latitude: s.wxLat, longitude: s.wxLon, models: 'meteoswiss_icon_seamless', timezone: 'Europe/Zurich', forecast_days: '5',
        current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m', hourly,
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max' });
      const r = await fetch('https://api.open-meteo.com/v1/forecast?' + p);
      if (!r.ok) throw new Error('Wetterdienst antwortet nicht (HTTP ' + r.status + ')');
      const j = await r.json(); if (j.error) throw new Error(j.reason || 'Wetterdaten fehlerhaft');
      this.data = j; this.at = Date.now(); this.err = '';
      try { localStorage.setItem('cavia-wx', JSON.stringify({ key: this.key(), at: this.at, data: j })); } catch {}
    } catch (e) { this.err = navigator.onLine === false ? 'Keine Internetverbindung.' : (e.message || 'Wetter konnte nicht geladen werden.'); }
    finally { this.loading = false; }
  },
  hours() {
    const h = this.data?.hourly; if (!h) return [];
    return h.time.map((t, i) => ({ t: new Date(t).getTime(), temp: h.temperature_2m?.[i], feels: h.apparent_temperature?.[i], hum: h.relative_humidity_2m?.[i], rain: h.precipitation?.[i], prob: h.precipitation_probability?.[i], code: h.weather_code?.[i], wind: h.wind_speed_10m?.[i], gust: h.wind_gusts_10m?.[i], dir: h.wind_direction_10m?.[i] }));
  },
  warnings() {
    const s = settings(), now = Date.now(), until = now + 24 * 3600000, place = s.wxPlace || 'Ihr Ort';
    const hs = this.hours().filter((h) => h.t > now - 3600000 && h.t <= until);
    const rules = [
      { k: 'gust', what: 'Starke Windböen', unit: 'km/h', test: (h) => h.gust != null && h.gust >= s.wxGust, val: (h) => h.gust, level: (p) => (p >= s.wxGust + 25 ? 'crit' : 'warn') },
      { k: 'rain', what: 'Starkregen', unit: 'mm/h', test: (h) => h.rain != null && h.rain >= s.wxRain, val: (h) => h.rain, level: (p) => (p >= s.wxRain * 2 ? 'crit' : 'warn'), dec: 1 },
      { k: 'storm', what: 'Gewitter', unit: '', test: (h) => h.code >= 95, val: (h) => h.code, level: (p) => (p >= 96 ? 'crit' : 'warn'), label: (p) => (p >= 96 ? 'mit möglichem Hagel' : '') },
      { k: 'heat', what: 'Hitze', unit: '°C', test: (h) => h.temp != null && h.temp >= s.wxHeat, val: (h) => h.temp, level: () => 'warn', dec: 1, hint: 'Gehege beschatten, Wasser auffüllen.' },
      { k: 'frost', what: 'Frost', unit: '°C', test: (h) => h.temp != null && h.temp <= s.wxFrost, val: (h) => h.temp, level: () => 'warn', dec: 1, min: true, hint: 'Aussengehege schützen, Wasser kann gefrieren.' },
    ];
    const out = [];
    for (const r of rules) {
      let ph = null;
      const flush = () => { if (!ph) return; const dur = Math.max(1, Math.round((ph.end - ph.start) / 3600000)); const tf = (t) => new Date(t).toLocaleString('de-CH', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
        out.push({ level: r.level(ph.peak), text: `${r.what}${r.label ? ' ' + r.label(ph.peak) : ''} in ${place}: ${tf(ph.start)} bis ${tf(ph.end)} (ca. ${dur} h)${r.unit ? `, bis ${fNum(ph.peak, r.dec || 0)} ${r.unit}` : ''}.${r.hint ? ' ' + r.hint : ''} Eigene Warnung aus der MeteoSchweiz-Prognose.` }); ph = null; };
      for (const h of hs) {
        if (r.test(h)) { const v = r.val(h); if (!ph) ph = { start: h.t - 3600000, end: h.t, peak: v }; else { ph.end = h.t; ph.peak = r.min ? Math.min(ph.peak, v) : Math.max(ph.peak, v); } }
        else flush();
      }
      flush();
    }
    return out;
  },
};

// ---------------- Speicher (IndexedDB, mit Speicher-Fallback) ----------------
const S = {
  recs: new Map(), blobs: new Map(), urls: new Map(), meta: new Map(), db: null, persistent: false,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('kavia', 2);
        r.onupgradeneeded = () => { const d = r.result; for (const n of ['records', 'blobs', 'meta']) if (!d.objectStoreNames.contains(n)) n === 'records' ? d.createObjectStore(n, { keyPath: 'key' }) : d.createObjectStore(n); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      const all = await this._req('records', 'readonly', (s) => s.getAll());
      all.forEach((r) => this.recs.set(r.key, r));
      this.persistent = true;
      try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch {}
    } catch { this.persistent = false; }
    // Ältere Datensätze (ohne Versionsvektor) diesem Gerät zuordnen, damit sie synchronisiert werden.
    for (const r of [...this.recs.values()]) if (!r.vv || typeof r.vv !== 'object') {
      const rec = { ...r, vv: { [Device.id]: r.version || 1 }, by: Device.id, updatedAt: r.updatedAt || Date.now() };
      delete rec.synced; this.recs.set(rec.key, rec); await this._write(rec);
    }
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  list(tbl) { const out = []; for (const r of this.recs.values()) if (r.tbl === tbl && !r.deleted) out.push(r.data); return out; },
  listDeleted() { return [...this.recs.values()].filter((r) => r.deleted); },
  get(tbl, id) { const r = this.recs.get(tbl + ':' + id); return r && !r.deleted ? r.data : null; },
  _next(prev) { const vv = { ...(prev?.vv || {}) }; vv[Device.id] = (vv[Device.id] || 0) + 1; return vv; },
  async save(tbl, data) {
    data = { ...data }; if (!data.id) data.id = uid();
    const key = tbl + ':' + data.id, prev = this.recs.get(key);
    const vv = this._next(prev);
    const rec = { key, tbl, id: data.id, data, vv, version: Object.values(vv).reduce((a, b) => a + b, 0), by: Device.id, updatedAt: Math.max(Date.now(), (prev?.updatedAt || 0) + 1), deleted: false };
    this.recs.set(key, rec); await this._write(rec); this._changed(rec, prev); return data;
  },
  async remove(tbl, id) {
    const key = tbl + ':' + id, prev = this.recs.get(key); if (!prev || prev.deleted) return;
    const vv = this._next(prev);
    const rec = { ...prev, vv, version: Object.values(vv).reduce((a, b) => a + b, 0), by: Device.id, updatedAt: Math.max(Date.now(), (prev.updatedAt || 0) + 1), deleted: true, deletedAt: Date.now() };
    this.recs.set(key, rec); await this._write(rec); this._changed(rec, prev);
  },
  /** Übernimmt einen Datensatz unverändert (Synchronisierung). */
  async putRaw(rec) { this.recs.set(rec.key, rec); await this._write(rec); },
  _changed(rec, prev) { try { Cloud.onLocalChange(rec, prev); } catch {} },
  async _write(rec) { if (!this.persistent) return; try { await this._req('records', 'readwrite', (s) => s.put(rec)); } catch { toast('Speichern auf diesem Gerät fehlgeschlagen. Ist der Speicher voll?'); } },
  async putBlob(id, blob) { this.blobs.set(id, blob); if (this.persistent) { try { await this._req('blobs', 'readwrite', (s) => s.put(blob, id)); } catch { toast('Foto konnte nicht gespeichert werden (Speicher voll?).'); } } },
  async getBlob(id) {
    if (this.blobs.has(id)) return this.blobs.get(id);
    if (!this.persistent) return null;
    try { const b = await this._req('blobs', 'readonly', (s) => s.get(id)); if (b) this.blobs.set(id, b); return b || null; } catch { return null; }
  },
  /** Blob-URL für Anzeige. Fehlt das Foto auf diesem Gerät, wird es aus OneDrive geholt. */
  async url(id) {
    if (!id) return null;
    if (this.urls.has(id)) return this.urls.get(id);
    let b = await this.getBlob(id);
    if (!b) { const m = this.list('media').find((x) => x.blobId === id); if (m?.remote) b = await Cloud.fetchBlob(m); }
    if (!b) return null; const u = URL.createObjectURL(b); this.urls.set(id, u); return u;
  },
  async allBlobIds() { if (!this.persistent) return [...this.blobs.keys()]; try { return await this._req('blobs', 'readonly', (s) => s.getAllKeys()); } catch { return [...this.blobs.keys()]; } },
  async metaGet(k) { if (this.meta.has(k)) return this.meta.get(k); if (!this.persistent) return null; try { const v = await this._req('meta', 'readonly', (s) => s.get(k)); if (v !== undefined) this.meta.set(k, v); return v ?? null; } catch { return null; } },
  async metaSet(k, v) { this.meta.set(k, v); if (this.persistent) { try { await this._req('meta', 'readwrite', (s) => s.put(v, k)); } catch {} } },
  async metaDel(k) { this.meta.delete(k); if (this.persistent) { try { await this._req('meta', 'readwrite', (s) => s.delete(k)); } catch {} } },
  /** Datensätze aus einem Backup übernehmen. mode: 'merge' (nur Neueres/Fehlendes) oder 'replace' (Zustand des Backups herstellen). */
  async importRecords(recs, mode = 'merge') {
    let added = 0, updated = 0, removed = 0;
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const inBackup = new Set();
    for (const r of recs || []) {
      if (!r || !r.key || !r.tbl || !r.id || LOCAL_TABLES.has(r.tbl)) continue;
      inBackup.add(r.key);
      const cur = this.recs.get(r.key);
      if (mode === 'replace') {
        if (r.deleted) { if (cur && !cur.deleted) { await this.remove(r.tbl, r.id); removed++; } continue; }
        if (!cur || cur.deleted) { await this.save(r.tbl, r.data); added++; }
        else if (!same(cur.data, r.data)) { await this.save(r.tbl, r.data); updated++; }
      } else {
        if (!cur) { if (!r.deleted) { await this.save(r.tbl, r.data); added++; } }
        else if ((r.updatedAt || 0) > (cur.updatedAt || 0) && (!same(cur.data, r.data) || !!cur.deleted !== !!r.deleted)) {
          if (r.deleted) await this.remove(r.tbl, r.id); else await this.save(r.tbl, r.data); updated++;
        }
      }
    }
    if (mode === 'replace') for (const r of [...this.recs.values()]) if (!r.deleted && !LOCAL_TABLES.has(r.tbl) && !inBackup.has(r.key)) { await this.remove(r.tbl, r.id); removed++; }
    return { added, updated, removed };
  },
};

const animals = (all = false) => S.list('animals').filter((a) => all || !a.archived).sort((a, b) => a.name.localeCompare(b.name));
const animalName = (id) => S.get('animals', id)?.name || '–';
const weightsOf = (aid) => S.list('weights').filter((w) => w.animalId === aid).sort((a, b) => ts(a.at) - ts(b.at));
const byNewest = (k) => (a, b) => ts(b[k]) - ts(a[k]);

// ---------------- Auswertung (keine Diagnose!) ----------------
const ADVICE_CRIT = 'Bitte heute noch tierärztlich abklären lassen und nicht abwarten.';
const ADVICE_WARN = 'Genau beobachten und tierärztlich abklären lassen, wenn es anhält oder weitere Zeichen dazukommen.';

function thresholds(a) {
  const s = settings();
  const n = (v, d) => (v === '' || v == null || Number.isNaN(+v) ? d : +v);
  return { warnPct: n(a.warnPct, s.warnPct), alarmPct: n(a.alarmPct, s.alarmPct), drop24: n(a.drop24, s.drop24), minWeight: n(a.minWeight, null), checkDays: n(a.checkDays, s.checkDays) };
}

function weightStatus(a) {
  const ws = weightsOf(a.id);
  const th = thresholds(a);
  if (!ws.length) return { level: 'none', last: null, msgs: [{ level: 'info', text: `${a.name}: noch kein Gewicht erfasst.` }] };
  const last = ws.at(-1), lt = ts(last.at), msgs = [];
  let level = 'ok', change7 = null, ref = null;
  let best = Infinity;
  for (const w of ws) {
    const d = lt - ts(w.at);
    if (d >= 4 * DAY && d <= 12 * DAY && Math.abs(d - 7 * DAY) < best) { best = Math.abs(d - 7 * DAY); ref = w; }
  }
  if (ref) {
    change7 = ((last.g - ref.g) / ref.g) * 100;
    const span = Math.round((lt - ts(ref.at)) / DAY);
    if (change7 <= -th.alarmPct) { level = 'crit'; msgs.push({ level: 'crit', text: `${a.name}: ${fNum(-change7, 1)} % Gewichtsverlust in ${span} Tagen (${ref.g} → ${last.g} g). ${ADVICE_CRIT}` }); }
    else if (change7 <= -th.warnPct) { level = 'warn'; msgs.push({ level: 'warn', text: `${a.name}: ${fNum(-change7, 1)} % weniger Gewicht in ${span} Tagen (${ref.g} → ${last.g} g). ${ADVICE_WARN}` }); }
  }
  const prev = ws.at(-2);
  if (prev && lt - ts(prev.at) <= 36 * 3600000 && prev.g - last.g >= th.drop24) {
    level = 'crit'; msgs.push({ level: 'crit', text: `${a.name}: ${prev.g - last.g} g weniger innert ${Math.round((lt - ts(prev.at)) / 3600000)} h. ${ADVICE_CRIT}` });
  }
  if (th.minWeight && last.g < th.minWeight) {
    level = 'crit'; msgs.push({ level: 'crit', text: `${a.name}: ${last.g} g liegt unter der festgelegten Untergrenze von ${th.minWeight} g. ${ADVICE_CRIT}` });
  }
  // starke Schwankungen: Standardabweichung der letzten 6 Messungen
  const recent = ws.slice(-6);
  if (recent.length >= 5) {
    const m = recent.reduce((s, w) => s + w.g, 0) / recent.length;
    const sd = Math.sqrt(recent.reduce((s, w) => s + (w.g - m) ** 2, 0) / recent.length);
    if (sd / m > 0.04 && level === 'ok') { level = 'warn'; msgs.push({ level: 'warn', text: `${a.name}: Gewicht schwankt stark (±${fNum(sd)} g). Immer zur gleichen Tageszeit wiegen; hält es an, tierärztlich abklären.` }); }
  }
  if (days(lt) >= th.checkDays) msgs.push({ level: 'info', text: `${a.name}: letzte Wägung vor ${days(lt)} Tagen – Gewichtskontrolle fällig.` });
  return { level, last, ref, change7, msgs };
}

function healthSignals(a) {
  const out = [];
  const c = S.list('checks').filter((x) => x.animalId === a.id).sort(byNewest('at'))[0];
  if (c && days(ts(c.at)) <= 3) {
    if (c.eating === 'none') out.push({ level: 'crit', text: `${a.name} frisst nicht (Kontrolle ${fDT(c.at)}). Bei Meerschweinchen ist das ein Notfall. Bitte sofort eine Tierarztpraxis kontaktieren.` });
    else if (c.eating === 'reduced') out.push({ level: 'warn', text: `${a.name} frisst weniger als sonst. Futteraufnahme und Kot eng beobachten; bei weiterer Abnahme sofort zum Tierarzt.` });
    if (c.droppings === 'none') out.push({ level: 'crit', text: `${a.name}: kein Kot beobachtet. ${ADVICE_CRIT}` });
    else if (c.droppings === 'diarrhea') out.push({ level: 'crit', text: `${a.name}: Durchfall. ${ADVICE_CRIT}` });
    else if (c.droppings === 'small' || c.droppings === 'soft') out.push({ level: 'warn', text: `${a.name}: Kot ${DROP[c.droppings]}. ${ADVICE_WARN}` });
    if (c.activity === 'apathetic') out.push({ level: 'crit', text: `${a.name} wirkt teilnahmslos. ${ADVICE_CRIT}` });
    if (c.drinking === 'none') out.push({ level: 'warn', text: `${a.name} trinkt nicht. ${ADVICE_WARN}` });
    if (+c.condition <= 2) out.push({ level: +c.condition === 1 ? 'crit' : 'warn', text: `${a.name}: Allgemeinzustand «${COND[c.condition]}». ${+c.condition === 1 ? ADVICE_CRIT : ADVICE_WARN}` });
  }
  const j = S.list('journal').filter((x) => x.animalId === a.id);
  for (const e of j) if (!e.resolved && +e.severity >= 4 && days(ts(e.at)) <= 14) out.push({ level: +e.severity === 5 ? 'crit' : 'warn', text: `${a.name}: «${e.title}» (${JCAT[e.category]}, ${SEV[e.severity]}) seit ${fDate(e.at)} offen. ${+e.severity === 5 ? ADVICE_CRIT : ADVICE_WARN}` });
  const counts = {};
  for (const e of j) if (days(ts(e.at)) <= 30) counts[e.category] = (counts[e.category] || 0) + 1;
  for (const [cat, n] of Object.entries(counts)) if (n >= 3) out.push({ level: 'info', text: `${a.name}: ${n} Einträge zu «${JCAT[cat]}» in 30 Tagen. Wiederkehrende Auffälligkeiten bei der nächsten Kontrolle ansprechen.` });
  // Kombination: Gewichtsverlust + weniger Fressen
  const ws = weightStatus(a);
  if ((ws.level === 'warn' || ws.level === 'crit') && c && c.eating !== 'normal' && c.eating !== 'increased' && days(ts(c.at)) <= 7)
    out.push({ level: 'crit', text: `${a.name}: Gewichtsverlust zusammen mit veränderter Futteraufnahme. ${ADVICE_CRIT}` });
  return out;
}

function climateStatus() {
  const s = settings();
  const last = S.list('climate').sort(byNewest('at'))[0];
  if (!last) return { last: null, msgs: [] };
  const msgs = [], t = +last.temp, h = last.hum === '' || last.hum == null ? null : +last.hum, fresh = Date.now() - ts(last.at) < 6 * 3600000;
  if (fresh) {
    if (t > s.tempHigh) msgs.push({ level: t > s.tempHigh + 2 ? 'crit' : 'warn', text: `Häuschen ${fNum(t, 1)} °C (über ${s.tempHigh} °C). Meerschweinchen sind hitzeempfindlich: Schatten, Kühlung, frisches Wasser.` });
    if (t < s.tempLow) msgs.push({ level: 'warn', text: `Häuschen ${fNum(t, 1)} °C (unter ${s.tempLow} °C). Für Wärme und trockene Einstreu sorgen.` });
    if (h != null && h > s.humHigh) msgs.push({ level: 'warn', text: `Luftfeuchtigkeit ${fNum(h)} % (über ${s.humHigh} %). Lüften, feuchte Einstreu wechseln.` });
    if (h != null && h < s.humLow) msgs.push({ level: 'info', text: `Luftfeuchtigkeit ${fNum(h)} % (unter ${s.humLow} %).` });
  }
  return { last, fresh, msgs };
}

// ---------------- Kalender-Logik ----------------
function occurrences(task, from, to) {
  const out = [], start = new Date(task.start);
  if (Number.isNaN(start.getTime())) return out;
  const step = task.repeat;
  if (step === 'none') { const t = start.getTime(); if (t >= from && t <= to) out.push(t); return out; }
  let d = new Date(start), guard = 0;
  const adv = () => {
    if (step === 'daily') d.setDate(d.getDate() + 1);
    else if (step === 'weekly') d.setDate(d.getDate() + 7);
    else if (step === 'every') d.setDate(d.getDate() + Math.max(1, +task.everyN || 1));
    else if (step === 'monthly') d.setMonth(d.getMonth() + 1);
  };
  if (step === 'daily' || step === 'weekly' || step === 'every') {
    const n = step === 'daily' ? 1 : step === 'weekly' ? 7 : Math.max(1, +task.everyN || 1);
    if (d.getTime() < from) { const k = Math.floor((from - d.getTime()) / (n * DAY)); d.setDate(d.getDate() + k * n); }
  }
  while (d.getTime() <= to && guard++ < 800) { if (d.getTime() >= from) out.push(d.getTime()); adv(); }
  return out;
}
const occKey = (taskId, t) => `${taskId}|${localDT(new Date(t))}`;
const isDone = (taskId, t) => S.list('completions').some((c) => c.key === occKey(taskId, t));

function agenda(from, to) {
  const items = [];
  for (const task of S.list('tasks')) if (task.active !== false)
    for (const t of occurrences(task, from, to)) items.push({ t, kind: 'task', task, done: isDone(task.id, t), title: task.title, animalId: task.animalId });
  for (const v of S.list('visits')) {
    const f = ts(v.followUp); if (f >= from && f <= to) items.push({ t: f, kind: 'follow', title: `Nachkontrolle: ${v.reason}`, animalId: v.animalId, visit: v });
    const a = ts(v.at); if (a > Date.now() && a >= from && a <= to) items.push({ t: a, kind: 'appt', title: `Tierarzt: ${v.reason}`, animalId: v.animalId, visit: v });
  }
  for (const d of medSlots(from, to)) items.push({ t: d.t, kind: 'med', title: `${d.med.name} (${d.med.dosage})`, animalId: d.med.animalId, med: d.med, done: !!d.dose, slot: d.slot });
  return items.sort((a, b) => a.t - b.t);
}

function medSlots(from, to) {
  const out = [];
  for (const m of S.list('meds')) {
    const times = String(m.times || '').split(/[,;\s]+/).filter((x) => /^\d{1,2}:\d{2}$/.test(x));
    if (!times.length || !m.start) continue;
    const s0 = new Date(m.start + 'T00:00'), e0 = m.end ? new Date(m.end + 'T23:59') : new Date(to);
    for (let d = new Date(Math.max(from, s0.getTime())); d.getTime() <= Math.min(to, e0.getTime()); d.setDate(d.getDate() + 1)) {
      for (const tm of times) {
        const [hh, mm] = tm.split(':');
        const t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh, +mm).getTime();
        if (t < from || t > to || t < s0.getTime() || t > e0.getTime()) continue;
        const slot = localDT(new Date(t));
        out.push({ t, slot, med: m, dose: S.list('doses').find((x) => x.medId === m.id && x.slot === slot) });
      }
      d.setHours(0, 0, 0, 0);
    }
  }
  return out;
}

// ---------------- Kosten-Logik ----------------
function shares(e) {
  const ids = (e.animals && e.animals.length ? e.animals : animals(true).filter((a) => !a.archived || ts(a.archivedAt) > ts(e.date)).map((a) => a.id));
  return ids.length ? ids.map((id) => [id, 1 / ids.length]) : [];
}
function costStats() {
  const ex = S.list('expenses');
  const byMonth = {}, byCat = {}, byAnimal = {}, byYear = {};
  let total = 0, vet = 0;
  for (const e of ex) {
    const v = +e.total || 0; total += v; if (e.category === 'vet' || e.category === 'meds') vet += v;
    const m = String(e.date).slice(0, 7), y = String(e.date).slice(0, 4);
    byMonth[m] = (byMonth[m] || 0) + v; byYear[y] = (byYear[y] || 0) + v; byCat[e.category] = (byCat[e.category] || 0) + v;
    for (const [id, sh] of shares(e)) byAnimal[id] = (byAnimal[id] || 0) + v * sh;
  }
  const months = Object.keys(byMonth).sort();
  let avg = 0;
  if (months.length) {
    const [y0, m0] = months[0].split('-').map(Number), now = new Date();
    const n = (now.getFullYear() - y0) * 12 + (now.getMonth() + 1 - m0) + 1;
    avg = total / Math.max(1, n);
  }
  return { total, vet, byMonth, byCat, byAnimal, byYear, avg };
}

// ---------------- Diagramme (SVG, interaktiv) ----------------
function lineChart({ series, height = 240, unit = '', bands = [], right = null, id = 'c' }) {
  const W = 680, H = height, L = 48, R = right ? 48 : 14, T = 14, B = 30;
  const pts = series.flatMap((s) => s.points);
  if (!pts.length) return '<div class="empty small">Noch keine Messwerte in diesem Zeitraum.</div>';
  let tMin = Math.min(...pts.map((p) => p.t)), tMax = Math.max(...pts.map((p) => p.t));
  if (tMin === tMax) { tMin -= DAY; tMax += DAY; }
  const scaleFor = (arr, extra = []) => {
    const vs = arr.map((p) => p.v).concat(extra);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (lo === hi) { lo -= 1; hi += 1; }
    const padv = (hi - lo) * 0.12; return [lo - padv, hi + padv];
  };
  const leftPts = series.filter((s) => !s.right).flatMap((s) => s.points);
  const [lo, hi] = scaleFor(leftPts, bands.map((b) => b.v));
  const rightPts = series.filter((s) => s.right).flatMap((s) => s.points);
  const [rlo, rhi] = rightPts.length ? scaleFor(rightPts) : [0, 1];
  const x = (t) => L + ((t - tMin) / (tMax - tMin)) * (W - L - R);
  const y = (v, r) => (r ? T + (1 - (v - rlo) / (rhi - rlo)) * (H - T - B) : T + (1 - (v - lo) / (hi - lo)) * (H - T - B));
  const ticks = 4; let g = '<g class="grid">';
  for (let i = 0; i <= ticks; i++) {
    const v = lo + ((hi - lo) * i) / ticks, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fNum(v, hi - lo < 10 ? 1 : 0)}</text>`;
    if (right) { const rv = rlo + ((rhi - rlo) * i) / ticks; g += `<text x="${W - R + 6}" y="${yy + 4}">${fNum(rv, 1)}</text>`; }
  }
  g += '</g>';
  const span = tMax - tMin, nx = 5; let xt = '';
  for (let i = 0; i <= nx; i++) {
    const t = tMin + (span * i) / nx, d = new Date(t);
    const lab = span > 300 * DAY ? d.toLocaleDateString('de-CH', { month: 'short', year: '2-digit' }) : span > 2 * DAY ? d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit' }) : d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    xt += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}">${esc(lab)}</text>`;
  }
  let bl = '';
  for (const b of bands) bl += `<line x1="${L}" x2="${W - R}" y1="${y(b.v)}" y2="${y(b.v)}" stroke="${b.color}" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W - R - 4}" y="${y(b.v) - 5}" text-anchor="end" style="fill:${b.color}">${esc(b.label)}</text>`;
  let body = '';
  series.forEach((s, si) => {
    const p = s.points.slice().sort((a, b) => a.t - b.t);
    if (!p.length) return;
    const d = p.map((q, i) => `${i ? 'L' : 'M'}${x(q.t).toFixed(1)},${y(q.v, s.right).toFixed(1)}`).join(' ');
    if (s.area && p.length > 1) body += `<path d="${d} L${x(p.at(-1).t)},${H - B} L${x(p[0].t)},${H - B} Z" fill="${s.color}" opacity=".10"/>`;
    body += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="4 4"' : ''}/>`;
    const showDots = p.length <= 120;
    p.forEach((q, i) => {
      const last = i === p.length - 1;
      if (!showDots && !last) return;
      body += `<circle cx="${x(q.t).toFixed(1)}" cy="${y(q.v, s.right).toFixed(1)}" r="${last ? 5.5 : 4}" fill="${last ? s.color : 'var(--surface)'}" stroke="${s.color}" stroke-width="2" data-act="tip" data-chart="${id}" data-tip="${esc(`${s.label}: ${fNum(q.v, s.dec ?? 0)} ${s.unit ?? unit} · ${fDT(new Date(q.t))}${q.note ? ' · ' + q.note : ''}`)}" tabindex="0"><title>${esc(`${fNum(q.v, s.dec ?? 0)} ${s.unit ?? unit}`)}</title></circle>`;
    });
  });
  const legend = series.length > 1 || right ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>` : '';
  return `${legend}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagramm">${g}${bl}${body}${xt}</svg></div><div class="tip" id="tip-${id}">Punkt antippen für Details.</div>`;
}

function barChart(rows, { unit = 'CHF', id = 'b', height = 200 } = {}) {
  if (!rows.length) return '<div class="empty small">Noch keine Daten.</div>';
  const W = 680, H = height, L = 52, B = 30, T = 12, R = 8;
  const max = Math.max(...rows.map((r) => r.v), 1);
  const bw = (W - L - R) / rows.length;
  let g = '<g class="grid">';
  for (let i = 0; i <= 4; i++) { const v = (max * i) / 4, yy = T + (1 - v / max) * (H - T - B); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fNum(v)}</text>`; }
  g += '</g>';
  const bars = rows.map((r, i) => {
    const h = (r.v / max) * (H - T - B), xx = L + i * bw + bw * 0.18, yy = H - B - h;
    return `<rect x="${xx}" y="${yy}" width="${bw * 0.64}" height="${Math.max(h, r.v ? 1 : 0)}" rx="4" fill="${r.color || 'var(--chart-1)'}" data-act="tip" data-chart="${id}" data-tip="${esc(`${r.label}: ${unit} ${fNum(r.v, 2)}`)}"><title>${esc(`${r.label}: ${fNum(r.v, 2)}`)}</title></rect>` +
      (rows.length <= 14 || i % 2 === 0 ? `<text x="${xx + bw * 0.32}" y="${H - 10}" text-anchor="middle">${esc(r.short || r.label)}</text>` : '');
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balkendiagramm">${g}${bars}</svg></div><div class="tip" id="tip-${id}">Balken antippen für Details.</div>`;
}

async function hydrate() {
  const els = [...document.querySelectorAll('[data-blob]')].filter((el) => !el.dataset.done);
  let i = 0;
  const worker = async () => {
    while (i < els.length) {
      const el = els[i++]; el.dataset.done = '1';
      const u = await S.url(el.dataset.blob).catch(() => null);
      if (!el.isConnected) continue;
      if (u) { if (el.tagName === 'IMG' || el.tagName === 'VIDEO') el.src = u; else if (el.tagName === 'A') el.href = u; }
      else if (el.tagName === 'A') { el.removeAttribute('href'); el.title = 'Noch nicht auf diesem Gerät – wird beim nächsten Abgleich geladen'; }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

// ---------------- Vergleich der Meerschweinchen ----------------
const PIG_COLORS = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)'];
const colorFor = (id) => PIG_COLORS[Math.max(0, animals(true).findIndex((a) => a.id === id)) % PIG_COLORS.length];
function changeOver(a, d) {
  const ws = weightsOf(a.id); if (ws.length < 2) return null;
  const last = ws.at(-1), lt = ts(last.at); let ref = null, best = Infinity;
  for (const w of ws) { const diff = lt - ts(w.at); if (diff >= d * 0.6 * DAY && diff <= d * 1.5 * DAY && Math.abs(diff - d * DAY) < best) { best = Math.abs(diff - d * DAY); ref = w; } }
  return ref ? { pct: ((last.g - ref.g) / ref.g) * 100, g: last.g - ref.g } : null;
}
const pct = (c) => (c ? `${c.pct > 0 ? '+' : ''}${fNum(c.pct, 1)} % <span class="muted small">(${c.g > 0 ? '+' : ''}${c.g} g)</span>` : '<span class="muted">–</span>');
function cmpSeries(sel, key, mode) {
  return sel.map((a) => {
    const ws = weightsOf(a.id).filter((w) => inRange(ts(w.at), key)); const base = ws[0]?.g;
    return { label: a.name, color: colorFor(a.id), unit: mode === 'pct' ? '%' : 'g', dec: mode === 'pct' ? 1 : 0,
      points: ws.map((w) => ({ t: ts(w.at), v: mode === 'pct' ? ((w.g - base) / base) * 100 : w.g })) };
  });
}
function dashCompare(list) {

    ${(() => { const k = ui.cmpRange; ui.cmpRange = '30'; const html = lineChart({ series: cmpSeries(list, 'cmpRange', 'pct'), unit: '%', bands: [{ v: 0, label: 'Ausgangsgewicht', color: 'var(--muted)' }], id: 'dcmp', height: 200 }); ui.cmpRange = k; return html; })()}</section>`;

function vCompare(list) {

  const nW = (a) => weightsOf(a.id).filter((w) => inRange(ts(w.at), 'cmpRange')).length;

      <div class="chips" role="group" aria-label="Tiere auswählen">${list.map((a) => `<button class="chip" data-act="cmpsel" data-id="${a.id}" aria-pressed="${sel.includes(a)}"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colorFor(a.id)};margin-right:6px;box-shadow:0 0 0 2px var(--surface)"></i>${esc(a.name)}</button>`).join('')}</div>

      <div class="row" style="margin-top:14px"><button class="btn" data-act="form" data-f="weight" data-animal="${id}">${icon('scale')}Gewicht eintragen</button></div></div>
      ${temp.length && pts.length ? `<div class="card"><h2>Gewicht und Häuschen-Temperatur</h2><p class="small muted" style="margin-bottom:8px">Zeigt, ob Gewichtsveränderungen mit Hitze- oder Kälteperioden zusammenfallen.</p>${lineChart({ series: [{ label: 'Gewicht (g, links)', color: 'var(--chart-1)', unit: 'g', points: pts }, { label: 'Temperatur (°C, rechts)', color: 'var(--chart-2)', unit: '°C', dec: 1, points: temp, right: true, dash: true }], right: true, id: 'wt' })}</div>` : ''}
      <div class="card"><h2>Alle Messungen</h2>${listWeights(id)}</div>`;
  } else if (tab === 'health') body = `<div class="card"><div class="head"><h2>Gesundheitskontrollen</h2><button class="btn sm" data-act="form" data-f="check" data-animal="${id}">${icon('plus')}Kontrolle</button></div>${listChecks(id)}</div>`;
  else if (tab === 'journal') body = `<div class="card"><div class="head"><h2>Gesundheitsjournal</h2><button class="btn sm" data-act="form" data-f="journal" data-animal="${id}">${icon('plus')}Eintrag</button></div>${listJournal(id)}</div>`;
  else if (tab === 'vet') body = `<div class="card"><div class="head"><h2>Tierarztgeschichte</h2><button class="btn sm" data-act="form" data-f="visit" data-animal="${id}">${icon('plus')}Besuch</button></div>${listVisits(id)}</div>`;
  else if (tab === 'meds') body = `<div class="card"><div class="head"><h2>Medikamente</h2><button class="btn sm" data-act="form" data-f="med" data-animal="${id}">${icon('plus')}Medikament</button></div>${listMeds(id)}</div>`;
  else if (tab === 'feed') body = `<div class="card"><div class="head"><h2>Fütterungsprotokoll</h2><button class="btn sm" data-act="form" data-f="feed" data-animal="${id}">${icon('plus')}Fütterung</button></div>${listFeed(id)}</div>`;
  else if (tab === 'photos') body = `<div class="card"><div class="head"><h2>Fotochronik</h2><button class="btn sm" data-act="form" data-f="photo" data-animal="${id}">${icon('plus')}Foto</button></div>${gallery(S.list('media').filter((m) => m.animalId === id))}</div>`;
  else if (tab === 'costs') { const ex = S.list('expenses').filter((e) => shares(e).some(([x]) => x === id)).sort(byNewest('date')); const tot = ex.reduce((s, e) => s + (+e.total || 0) * (shares(e).find(([x]) => x === id)?.[1] || 0), 0); body = `<div class="card"><div class="head"><h2>Kosten für ${esc(a.name)}</h2><span class="big">${chf(tot)}</span></div>${listExpenses(ex, id)}</div>`; }
  else body = `<div class="card"><div class="head"><h2>Stammdaten</h2><button class="btn sm ghost" data-act="form" data-f="animal" data-id="${id}">Bearbeiten</button></div><dl class="kv">${[
    ['Geburtsdatum', a.birth ? fDate(a.birth) + ' (' + ageText(a.birth) + ')' : ''], ['Geschlecht', SEX[a.sex]], ['Kastration', NEUTER[a.neuter]], ['Rasse', a.breed], ['Fellfarbe, Merkmale', [a.coat, a.markings].filter(Boolean).join(' · ')], ['Herkunft', a.origin], ['Einzug', fDate(a.arrival)], ['Gewicht bei Aufnahme', a.arrivalWeight ? a.arrivalWeight + ' g' : ''], ['Gesundheitliche Vorgeschichte', a.history], ['Bekannte Erkrankungen', a.conditions], ['Medikamente', a.medsNote], ['Unverträglichkeiten', a.intolerances], ['Bemerkungen', a.notes]
  ].filter(([, v]) => v && v !== '–').map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
  <div class="row" style="margin-top:14px">${a.archived ? `<button class="btn soft" data-act="unarchive" data-id="${id}">Aus Archiv zurückholen</button>` : `<button class="btn soft" data-act="form" data-f="archive" data-id="${id}">Archivieren</button>`}</div></div>`;

  return `<section class="head"><div class="row">${avatar(a, true)}<div><p class="eyebrow">${a.archived ? 'Archiviert' : 'Meerschweinchen'}</p><h1>${esc(a.name)}${exBadge(a)}</h1><p class="muted small">${[SEX[a.sex], NEUTER[a.neuter], a.breed, a.birth ? ageText(a.birth) : ''].filter(Boolean).map(esc).join(' · ')}</p></div></div>
    <div class="row"><button class="btn" data-act="form" data-f="weight" data-animal="${id}">${icon('scale')}Wiegen</button><button class="btn ghost" data-act="form" data-f="pdf" data-animal="${id}">${icon('file')}PDF-Akte</button></div></section>
  ${msgs.filter((m) => m.level !== 'info' || /fällig|noch kein/.test(m.text)).map(alertBox).join('')}
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</div>
  ${body}`;
}

function listWeights(id) {
  const ws = weightsOf(id).slice().reverse();
  if (!ws.length) return '<p class="muted">Noch keine Messungen.</p>';
  return `<div class="list">${ws.slice(0, 60).map((w, i) => { const prev = ws[i + 1]; const d = prev ? w.g - prev.g : null; return `<div class="item click" data-act="form" data-f="weight" data-id="${w.id}"><div><div class="t num">${fNum(w.g)} g ${d != null ? `<span class="small" style="color:var(--${d < 0 ? 'warn' : 'muted'})">${d > 0 ? '+' : ''}${d} g</span>` : ''}</div><div class="meta">${fDT(w.at)}${w.note ? ' · ' + esc(w.note) : ''}</div></div></div>`; }).join('')}</div>${ws.length > 60 ? `<p class="small muted">… und ${ws.length - 60} ältere Messungen (im Diagramm unter «Alle»).</p>` : ''}`;
}
function listChecks(id) {
  const cs = S.list('checks').filter((c) => !id || c.animalId === id).sort(byNewest('at'));
  if (!cs.length) return '<p class="muted">Noch keine Gesundheitskontrollen.</p>';
  return `<div class="list">${cs.map((c) => `<div class="item click" data-act="form" data-f="check" data-id="${c.id}"><div><div class="t">${fDT(c.at)}${id ? '' : ' · ' + esc(animalName(c.animalId))}</div><div class="meta">Zustand ${COND[c.condition] || '–'} · Fressen ${EAT[c.eating] || '–'} · Trinken ${DRINK[c.drinking] || '–'} · Kot ${DROP[c.droppings] || '–'} · Aktivität ${ACT[c.activity] || '–'}${c.notes ? ' · ' + esc(c.notes) : ''}</div></div><span class="pill ${c.eating === 'none' || c.droppings === 'diarrhea' || c.droppings === 'none' || c.activity === 'apathetic' ? 'crit' : (c.eating === 'reduced' || ['soft', 'small'].includes(c.droppings)) ? 'warn' : 'ok'}">${c.eating === 'normal' && c.droppings === 'normal' ? 'unauffällig' : 'prüfen'}</span></div>`).join('')}</div>`;
}
function listJournal(id, cat = '') {
  const js = S.list('journal').filter((e) => (!id || e.animalId === id) && (!cat || e.category === cat)).sort(byNewest('at'));
  if (!js.length) return '<p class="muted">Keine Einträge.</p>';
  return `<div class="list">${js.map((e) => { const media = S.list('media').filter((m) => m.entity === 'journal' && m.entityId === e.id); const parent = e.follows ? S.get('journal', e.follows) : null; return `<div class="item click" data-act="form" data-f="journal" data-id="${e.id}"><div style="min-width:0"><div class="t">${esc(e.title)}${e.resolved ? ' <span class="pill ok">abgeschlossen</span>' : ''}</div><div class="meta">${fDT(e.at)} · ${JCAT[e.category]}${id ? '' : ' · ' + esc(animalName(e.animalId))}${parent ? ' · Verlauf von «' + esc(parent.title) + '»' : ''}</div>${e.description ? `<p class="small" style="margin-top:4px">${esc(e.description)}</p>` : ''}${media.length ? `<div class="thumbs" style="margin-top:8px">${media.slice(0, 4).map(mediaThumb).join('')}</div>` : ''}</div><span class="pill ${+e.severity >= 4 ? 'crit' : +e.severity === 3 ? 'warn' : 'info'}">${SEV[e.severity]}</span></div>`; }).join('')}</div>`;
}
const mediaThumb = (m) => (m.mime || '').startsWith('video') ? `<video data-blob="${esc(m.blobId)}" muted playsinline></video>` : `<img data-blob="${esc(m.blobId)}" alt="${esc(m.caption || 'Foto')}">`;
function listVisits(id) {
  const vs = S.list('visits').filter((v) => !id || v.animalId === id).sort(byNewest('at'));
  if (!vs.length) return '<p class="muted">Noch keine Tierarztbesuche.</p>';
  return `<div class="list">${vs.map((v) => `<div class="item click" data-act="form" data-f="visit" data-id="${v.id}"><div style="min-width:0"><div class="t">${esc(v.reason)}</div><div class="meta">${fDate(v.at)} · ${esc(v.practice || 'Praxis')}${id ? '' : ' · ' + esc(animalName(v.animalId))}</div>${v.diagnosis ? `<p class="small" style="margin-top:4px"><strong>Diagnose:</strong> ${esc(v.diagnosis)}</p>` : ''}${v.treatment ? `<p class="small"><strong>Behandlung:</strong> ${esc(v.treatment)}</p>` : ''}</div>${v.followUp ? `<span class="pill ${ts(v.followUp) < Date.now() ? 'ok' : 'info'}">Nachkontrolle ${fDate(v.followUp)}</span>` : ''}</div>`).join('')}</div>`;
}
function listMeds(id) {
  const ms = S.list('meds').filter((m) => !id || m.animalId === id).sort(byNewest('start'));
  if (!ms.length) return '<p class="muted">Keine Medikamente erfasst.</p>';
  const today = localDate();
  return `<div class="list">${ms.map((m) => { const active = m.start <= today && (!m.end || m.end >= today); const given = S.list('doses').filter((d) => d.medId === m.id).length; return `<div class="item click" data-act="form" data-f="med" data-id="${m.id}"><div><div class="t">${esc(m.name)} <span class="pill ${active ? 'info' : 'ok'}">${active ? 'laufend' : 'beendet'}</span></div><div class="meta">${esc(m.dosage)}${m.times ? ' · ' + esc(m.times) + ' Uhr' : ''} · ${fDate(m.start)} bis ${m.end ? fDate(m.end) : 'offen'}${id ? '' : ' · ' + esc(animalName(m.animalId))} · ${given} Gabe(n) dokumentiert</div></div></div>`; }).join('')}</div>`;
}
function listFeed(id) {
  const fs = S.list('feed').filter((f) => !id || !f.animalId || f.animalId === id).sort(byNewest('at'));
  if (!fs.length) return '<p class="muted">Noch keine Fütterungen protokolliert.</p>';
  return `<div class="list">${fs.slice(0, 80).map((f) => `<div class="item click" data-act="form" data-f="feed" data-id="${f.id}"><div><div class="t">${esc(f.food)}${f.amount ? ' · ' + esc(f.amount) : ''}</div><div class="meta">${fDT(f.at)} · ${f.animalId ? esc(animalName(f.animalId)) : 'ganze Gruppe'}${f.notes ? ' · ' + esc(f.notes) : ''}</div></div>${f.behavior ? `<span class="pill ${f.behavior === 'none' ? 'crit' : f.behavior === 'reduced' ? 'warn' : 'ok'}">${{ none: 'nicht gefressen', reduced: 'zögerlich', normal: 'normal', eager: 'gierig' }[f.behavior]}</span>` : ''}</div>`).join('')}</div>`;
}
function listExpenses(ex, aid) {
  if (!ex.length) return '<p class="muted">Keine Ausgaben.</p>';
  return `<div class="list">${ex.map((e) => { const sh = aid ? shares(e).find(([x]) => x === aid)?.[1] : null; return `<div class="item click" data-act="form" data-f="expense" data-id="${e.id}"><div><div class="t">${esc(e.merchant || ECAT[e.category])}${e.receiptMedia ? ' <span class="pill info">Beleg</span>' : ''}${exBadge(e)}</div><div class="meta">${fDate(e.date)} · ${ECAT[e.category]} · ${e.animals?.length ? e.animals.map(animalName).map(esc).join(', ') : 'alle Tiere'}</div></div><div class="num" style="text-align:right">${chf(e.total)}${sh != null && sh < 1 ? `<div class="small muted">Anteil ${chf((+e.total || 0) * sh)}</div>` : ''}</div></div>`; }).join('')}</div>`;
}
function gallery(ms) {
  ms = ms.slice().sort((a, b) => ts(b.takenAt) - ts(a.takenAt));
  if (!ms.length) return '<p class="muted">Noch keine Fotos.</p>';
  return `<div class="gallery">${ms.map((m) => `<figure>${(m.mime || '').startsWith('video') ? `<video data-blob="${esc(m.blobId)}" controls playsinline preload="metadata"></video>` : (m.mime || '').startsWith('image') ? `<img data-blob="${esc(m.blobId)}" alt="${esc(m.caption || 'Foto')}" data-act="form" data-f="photo" data-id="${m.id}" style="cursor:pointer">` : `<a class="btn soft" data-blob="${esc(m.blobId)}" target="_blank" rel="noopener">${icon('file')}Dokument</a>`}<figcaption>${fDate(m.takenAt)}${m.animalId ? ' · ' + esc(animalName(m.animalId)) : ''}${m.caption ? ' · ' + esc(m.caption) : ''}</figcaption></figure>`).join('')}</div>`;
}

function vHealth() {
  const tabs = [['weight', 'Gewicht'], ['check', 'Kontrollen'], ['journal', 'Journal'], ['feed', 'Fütterung']];
  const t = ui.gTab;
  let body = '';
  if (t === 'weight') {
    const list = animals();
    body = `<div class="card"><div class="head"><h2>Gewicht aller Tiere</h2><button class="btn" data-act="form" data-f="weightAll">${icon('scale')}Alle wiegen</button></div>
    ${list.length ? `<div class="list">${list.map((a) => { const s = weightStatus(a); return `<div class="item click" data-act="nav" data-r="tier-${a.id}"><div><div class="t">${esc(a.name)}</div><div class="meta">${s.last ? fDT(s.last.at) : 'noch nicht gewogen'}${s.change7 != null ? ' · ' + (s.change7 > 0 ? '+' : '') + fNum(s.change7, 1) + ' % in ~7 Tagen' : ''}</div></div><div class="num big" style="font-size:1.2rem">${s.last ? fNum(s.last.g) + ' g' : '–'}</div></div>`; }).join('')}</div>` : '<p class="muted">Legen Sie zuerst ein Meerschweinchen an.</p>'}</div>`;
  } else if (t === 'check') body = `<div class="card"><div class="head"><h2>Gesundheitskontrollen</h2><button class="btn sm" data-act="form" data-f="check">${icon('plus')}Kontrolle</button></div>${listChecks()}</div>`;
  else if (t === 'journal') body = `<div class="card"><div class="head"><h2>Gesundheitsjournal</h2><button class="btn sm" data-act="form" data-f="journal">${icon('plus')}Auffälligkeit</button></div>
    <div class="chips" style="margin-bottom:10px"><button class="chip" data-act="jfilter" data-v="" aria-pressed="${!ui.jFilter}">Alle</button>${Object.entries(JCAT).map(([k, l]) => `<button class="chip" data-act="jfilter" data-v="${k}" aria-pressed="${ui.jFilter === k}">${l}</button>`).join('')}</div>${listJournal(null, ui.jFilter)}</div>`;
  else body = `<div class="card"><div class="head"><h2>Fütterungsprotokoll</h2><button class="btn sm" data-act="form" data-f="feed">${icon('plus')}Fütterung</button></div>${listFeed()}</div>`;
  return `<section class="head"><h1>Gesundheit</h1></section><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${t === k}" data-act="gtab" data-v="${k}">${l}</button>`).join('')}</div>${body}`;
}

function vVet() {
  const practices = [...new Set(S.list('visits').map((v) => v.practice).filter(Boolean))];
  return `<section class="head"><h1>Tierarzt & Medikamente</h1><div class="row"><button class="btn" data-act="form" data-f="visit">${icon('plus')}Tierarztbesuch</button><button class="btn ghost" data-act="form" data-f="med">${icon('plus')}Medikament</button></div></section>
  <div class="card"><h2>Tierarztbesuche</h2>${listVisits()}</div>
  <div class="card"><h2>Medikamente</h2>${listMeds()}</div>
  ${practices.length ? `<div class="card"><h2>Ihre Praxen</h2><p>${practices.map(esc).join(' · ')}</p></div>` : ''}`;
}

function vCalendar() {
  const [y, m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), startDow = (first.getDay() + 6) % 7;
  const gridStart = new Date(y, m - 1, 1 - startDow);
  const from = gridStart.getTime(), to = from + 42 * DAY;
  const items = agenda(from, to);
  const byDay = {}; for (const it of items) (byDay[localDate(new Date(it.t))] ||= []).push(it);
  let cells = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((d) => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart); d.setDate(d.getDate() + i); const k = localDate(d);
    cells += `<button data-act="calday" data-v="${k}" class="${d.getMonth() !== m - 1 ? 'out' : ''} ${k === localDate() ? 'today' : ''}" aria-pressed="${ui.calSel === k}" aria-label="${d.toLocaleDateString('de-CH')}${byDay[k] ? ', ' + byDay[k].length + ' Einträge' : ''}"><span>${d.getDate()}</span><span class="dots">${(byDay[k] || []).slice(0, 3).map(() => '<i></i>').join('')}</span></button>`;
  }
  const sel = byDay[ui.calSel] || [];
  const tasks = S.list('tasks').sort((a, b) => a.title.localeCompare(b.title));
  return `<section class="head"><h1>Kalender</h1><button class="btn" data-act="form" data-f="task">${icon('plus')}Aufgabe / Termin</button></section>
  <div class="grid"><div class="card"><div class="head"><button class="btn sm ghost" data-act="calmonth" data-v="-1" aria-label="Vorheriger Monat">‹</button><h2>${first.toLocaleDateString('de-CH', { month: 'long', year: 'numeric' })}</h2><button class="btn sm ghost" data-act="calmonth" data-v="1" aria-label="Nächster Monat">›</button></div><div class="cal">${cells}</div></div>
  <div class="card"><h2>${new Date(ui.calSel + 'T12:00').toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' })}</h2>
  ${sel.length ? `<div class="list">${sel.map((x) => `<div class="item"><div><div class="t">${esc(x.title)}</div><div class="meta">${new Date(x.t).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' })}${x.animalId ? ' · ' + esc(animalName(x.animalId)) : ''}</div></div>${x.kind === 'task' ? (x.done ? '<span class="pill ok">erledigt</span>' : `<button class="btn sm soft" data-act="done" data-task="${x.task.id}" data-t="${x.t}">Erledigt</button>`) : x.kind === 'med' ? (x.done ? '<span class="pill ok">gegeben</span>' : `<button class="btn sm" data-act="dose" data-med="${x.med.id}" data-slot="${x.slot}">Gegeben</button>`) : '<span class="pill info">Tierarzt</span>'}</div>`).join('')}</div>` : '<p class="muted">Nichts geplant.</p>'}</div></div>
  <div class="card"><h2>Alle Aufgaben</h2>${tasks.length ? `<div class="list">${tasks.map((t) => `<div class="item click" data-act="form" data-f="task" data-id="${t.id}"><div><div class="t">${esc(t.title)}</div><div class="meta">${TKIND[t.kind]} · ${t.repeat === 'every' ? 'alle ' + t.everyN + ' Tage' : REPEAT[t.repeat]} · ab ${fDT(t.start)}${t.animalId ? ' · ' + esc(animalName(t.animalId)) : ''}</div></div></div>`).join('')}</div>` : '<p class="muted">Noch keine Aufgaben. Typisch: wöchentliche Gewichtskontrolle, Krallen schneiden alle 4–6 Wochen, Gehegereinigung.</p>'}
  <p class="small muted" style="margin-top:10px">Erinnerungen erscheinen hier und in der Übersicht. Push-Benachrichtigungen aufs Handy kommen mit dem Raspberry Pi.</p></div>`;
}

function vCosts() {
  const cs = costStats();
  const ex = S.list('expenses').sort(byNewest('date'));
  const months = []; for (let i = 11; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const k = localDate(d).slice(0, 7); months.push({ label: d.toLocaleDateString('de-CH', { month: 'long', year: 'numeric' }), short: d.toLocaleDateString('de-CH', { month: 'short' }), v: cs.byMonth[k] || 0 }); }
  const cats = Object.entries(cs.byCat).sort((a, b) => b[1] - a[1]);
  const maxC = Math.max(...cats.map((c) => c[1]), 1);
  const years = Object.entries(cs.byYear).sort();
  return `<section class="head"><h1>Kosten</h1><div class="row"><button class="btn" data-act="form" data-f="expense" data-receipt="1">${icon('photo')}Beleg fotografieren</button><button class="btn ghost" data-act="form" data-f="expense">${icon('plus')}Ausgabe</button></div></section>
  <div class="grid-2">
    <div class="card"><p class="eyebrow">Gesamt</p><p class="big">${chf(cs.total)}</p></div>
    <div class="card"><p class="eyebrow">Tierarzt + Medikamente</p><p class="big">${chf(cs.vet)}</p></div>
    <div class="card"><p class="eyebrow">Ø pro Monat</p><p class="big">${chf(cs.avg)}</p></div>
    <div class="card"><p class="eyebrow">Dieses Jahr</p><p class="big">${chf(cs.byYear[String(new Date().getFullYear())] || 0)}</p></div>
  </div>

async function refreshCloudInfo(force) {
  if (!Cloud.connected() || Auth.needsLogin || navigator.onLine === false || ui.cloud.loading.key) return;
  if (!force && ui.cloud.keyState) return;
  ui.cloud.loading.key = true;
  try { ui.cloud.keyState = await Backup.status(); Cloud.st.backupKeyState = ui.cloud.keyState; Cloud.saveState(); } catch {} finally { ui.cloud.loading.key = false; }
  if (route() === 'cloud') render();
}

function vSearch() {
  const q = ui.q.trim().toLowerCase();
  const hit = (...xs) => xs.some((x) => String(x || '').toLowerCase().includes(q));
  const res = [];
  for (const a of animals(true)) if (hit(a.name, a.breed, a.notes, a.conditions, a.history)) res.push({ t: a.name, m: 'Meerschweinchen', r: 'tier-' + a.id });
  for (const e of S.list('journal')) if (hit(e.title, e.description, e.notes, JCAT[e.category])) res.push({ t: e.title, m: `Journal · ${animalName(e.animalId)} · ${fDate(e.at)}`, f: 'journal', id: e.id });
  for (const v of S.list('visits')) if (hit(v.reason, v.practice, v.symptoms, v.diagnosis, v.treatment, v.recommendations, v.notes, v.meds)) res.push({ t: v.reason, m: `Tierarzt · ${animalName(v.animalId)} · ${fDate(v.at)}`, f: 'visit', id: v.id });
  for (const m of S.list('meds')) if (hit(m.name, m.dosage, m.instructions)) res.push({ t: m.name, m: `Medikament · ${animalName(m.animalId)}`, f: 'med', id: m.id });
  for (const x of S.list('expenses')) if (hit(x.merchant, x.notes, ECAT[x.category], ...(x.items || []).map((i) => i.d))) res.push({ t: x.merchant || ECAT[x.category], m: `Kosten · ${chf(x.total)} · ${fDate(x.date)}`, f: 'expense', id: x.id });
  for (const m of S.list('media')) if (hit(m.caption)) res.push({ t: m.caption, m: `Foto · ${fDate(m.takenAt)}`, f: 'photo', id: m.id });
  for (const t of S.list('tasks')) if (hit(t.title, t.notes)) res.push({ t: t.title, m: `Aufgabe · ${TKIND[t.kind]}`, f: 'task', id: t.id });
  return `<section class="head"><h1>Suche: «${esc(ui.q)}»</h1><button class="btn ghost" data-act="clearq">Suche beenden</button></section>
  <div class="card">${res.length ? `<div class="list">${res.map((r) => `<div class="item click" ${r.r ? `data-act="nav" data-r="${r.r}"` : `data-act="form" data-f="${r.f}" data-id="${r.id}"`}><div><div class="t">${esc(r.t)}</div><div class="meta">${esc(r.m)}</div></div></div>`).join('')}</div>` : '<p class="muted">Nichts gefunden.</p>'}</div>`;
}
