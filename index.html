const form = { type: null, data: {}, files: {}, receipt: null, items: [], confirmDel: false };

function openForm(type, ds = {}) {
  if (['weightAll', 'pdf', 'archive', 'wipe'].includes(type)) return openSpecial(type, ds);
  const def = FORMS[type];
  let data = ds.id ? { ...(S.get(def.tbl, ds.id) || {}) } : {};
  if (!ds.id && ds.animal) data.animalId = ds.animal;
  if (type !== 'animal' && type !== 'expense' && type !== 'climate' && !ds.id && !data.animalId && animals().length === 1 && !['feed', 'task', 'photo'].includes(type)) data.animalId = animals()[0].id;
  if (['weight', 'check', 'journal', 'visit', 'med'].includes(type) && !animals().length) { toast('Bitte zuerst ein Meerschweinchen anlegen.'); return openForm('animal'); }
  Object.assign(form, { type, data, files: {}, receipt: null, items: (data.items || []).map((x) => ({ ...x })), confirmDel: false, wantReceipt: !!ds.receipt, overwriteOk: false, baseVV: ds.id ? JSON.stringify(S.recs.get(def.tbl + ':' + ds.id)?.vv || {}) : '' });
  drawForm();
}

function fieldHtml(f, d) {
  if (f.row) return `<div class="grid-2">${f.row.map((x) => fieldHtml(x, d)).join('')}</div>`;
  if (f.set) return `<fieldset class="fieldset"><legend>${esc(f.set)}</legend>${f.hint ? `<p class="small muted">${esc(f.hint)}</p>` : ''}${f.fields.map((x) => fieldHtml(x, d)).join('')}</fieldset>`;
  const v = d[f.k] ?? f.def ?? '', id = 'f-' + f.k, req = f.req ? 'required' : '';
  const lab = `<label for="${id}">${esc(f.l)}${f.req ? '' : ' <span class="muted" style="font-weight:400">(optional)</span>'}</label>`;
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  switch (f.type) {
    case 'textarea': return `<div class="field">${lab}<textarea id="${id}" name="${f.k}" ${req}>${esc(v)}</textarea>${hint}</div>`;
    case 'select': return `<div class="field">${lab}<select id="${id}" name="${f.k}" ${req}>${f.opts.map(([k, l]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${hint}</div>`;
    case 'radio': return `<div class="field"><span class="lbl">${esc(f.l)}</span><div class="checks" role="radiogroup">${f.opts.map(([k, l]) => `<label><input type="radio" name="${f.k}" value="${esc(k)}" ${String(v) === String(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div></div>`;
    case 'check': return `<div class="field"><label style="font-weight:400;display:flex;gap:10px;align-items:center"><input type="checkbox" id="${id}" name="${f.k}" ${v ? 'checked' : ''} style="width:22px;height:22px"> ${esc(f.l)}</label></div>`;
    case 'date': return `<div class="field">${lab}<input id="${id}" name="${f.k}" type="date" value="${esc(v)}" ${req}>${hint}</div>`;
    case 'datetime': return `<div class="field">${lab}<input id="${id}" name="${f.k}" type="datetime-local" value="${esc(v)}" ${req}>${hint}</div>`;
    case 'int': case 'num': return `<div class="field">${lab}<input id="${id}" name="${f.k}" type="number" inputmode="${f.type === 'int' ? 'numeric' : 'decimal'}" step="${f.step || (f.type === 'int' ? '1' : 'any')}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} value="${esc(v)}" class="${f.cls || ''}" ${f.auto ? 'autofocus' : ''} ${req}>${hint}</div>`;
    case 'photo': { const m = d.photoMedia ? S.get('media', d.photoMedia) : null; return `<div class="field"><span class="lbl">${esc(f.l)}</span><div class="row">${m ? `<img class="avatar" data-blob="${esc(m.blobId)}" alt="">` : ''}<input id="${id}" type="file" accept="image/*" data-file="${f.k}"></div><div class="thumbs" id="prev-${f.k}"></div></div>`; }
    case 'media': case 'files': {
      const existing = d.id && f.type === 'media' ? S.list('media').filter((m) => m.entity === f.entity && m.entityId === d.id) : [];
      return `<div class="field"><label for="${id}">${esc(f.l || 'Dateien')}</label>${existing.length ? `<div class="thumbs">${existing.map(mediaThumb).join('')}</div>` : ''}<input id="${id}" type="file" multiple accept="image/*,video/*${f.docs || f.type === 'files' ? ',application/pdf' : ''}" data-file="${f.k}"><div class="thumbs" id="prev-${f.k}"></div><span class="hint">Auf dem Handy können Sie direkt die Kamera wählen. Videos bis 50 MB.</span></div>`;
    }
    case 'preview': { const m = d; return `<div>${(m.mime || '').startsWith('video') ? `<video data-blob="${esc(m.blobId)}" controls style="width:100%;border-radius:12px"></video>` : (m.mime || '').startsWith('image') ? `<img data-blob="${esc(m.blobId)}" alt="" style="width:100%;border-radius:12px">` : `<a class="btn soft" data-blob="${esc(m.blobId)}" target="_blank" rel="noopener">Dokument öffnen</a>`}</div>`; }
    case 'receipt': {
      const m = d.receiptMedia ? S.get('media', d.receiptMedia) : null;
      return `<div class="fieldset"><div class="lbl" style="font-weight:700">${esc(f.l)}</div>${m ? `<img data-blob="${esc(m.blobId)}" alt="Beleg" style="max-height:220px;width:auto;border-radius:10px">` : ''}
        <input id="${id}" type="file" accept="image/*" data-file="receipt"><div class="thumbs" id="prev-receipt"></div>
        <div class="row" id="ocr-row" ${OCR.ok ? '' : 'hidden'}><button type="button" class="btn soft" data-act="ocr">Beleg automatisch auslesen</button><span class="small muted" id="ocr-msg">Das Foto wird dafür an Claude gesendet und ausgewertet. Sie prüfen alles vor dem Speichern.</span></div>
        ${OCR.ok ? '' : '<p class="small muted">Das Originalfoto wird gespeichert. Die Angaben tragen Sie unten ein.</p>'}</div>`;
    }
    case 'items': return `<div class="field"><span class="lbl">${esc(f.l)} <span class="muted" style="font-weight:400">(optional)</span></span><div class="items-table" id="items">${itemsHtml()}</div><div><button type="button" class="btn sm ghost" data-act="additem">${icon('plus')}Position</button></div></div>`;
    case 'animals': { const sel = new Set(d.animals || []); return `<div class="field"><span class="lbl">${esc(f.l)}</span><div class="checks">${animals(true).filter((a) => !a.archived || sel.has(a.id)).map((a) => `<label><input type="checkbox" name="animals" value="${a.id}" ${sel.has(a.id) ? 'checked' : ''}> ${esc(a.name)}</label>`).join('') || '<span class="muted small">Noch keine Tiere.</span>'}</div></div>`; }
    default: return `<div class="field">${lab}<input id="${id}" name="${f.k}" value="${esc(v)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} ${f.list ? `list="dl-${f.k}"` : ''} ${req} ${f.auto ? 'autofocus' : ''}>${f.list ? `<datalist id="dl-${f.k}">${f.list.map((x) => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}${hint}</div>`;
  }
}
const itemsHtml = () => form.items.map((it, i) => `<div class="r"><input aria-label="Bezeichnung" data-item="${i}" data-k="d" value="${esc(it.d)}" placeholder="Bezeichnung"><input aria-label="Betrag CHF" data-item="${i}" data-k="a" type="number" step="0.05" inputmode="decimal" value="${esc(it.a)}" placeholder="CHF"><button type="button" class="btn sm ghost" data-act="delitem" data-i="${i}" aria-label="Position entfernen">×</button></div>`).join('');

function drawForm() {
  const def = FORMS[form.type], d = form.data;

    <div class="row" style="justify-content:space-between"><div class="row">${d.id ? (form.confirmDel ? `<button type="button" class="btn danger" data-act="delconfirm">Endgültig löschen</button><button type="button" class="btn ghost" data-act="delcancel">Abbrechen</button>` : `<button type="button" class="btn ghost" data-act="del">Löschen</button>`) : ''}</div>

}
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; document.body.style.overflow = ''; }

function readFields(defs, fd, out) {
  for (const f of defs) {
    if (f.row) { readFields(f.row, fd, out); continue; }
    if (f.set) { readFields(f.fields, fd, out); continue; }
    if (['photo', 'media', 'files', 'preview', 'receipt', 'items'].includes(f.type)) continue;
    if (f.type === 'animals') { out.animals = fd.getAll('animals'); continue; }
    if (f.type === 'check') { out[f.k] = fd.get(f.k) === 'on'; continue; }
    let v = fd.get(f.k); if (v == null) continue; v = String(v).trim();
    if (f.type === 'int') v = v === '' ? '' : Math.round(+v);
    else if (f.type === 'num') v = v === '' ? '' : +String(v).replace(',', '.');
    out[f.k] = v;
  }
}
function validateFields(defs, data, errs) {
  for (const f of defs) {
    if (f.row) { validateFields(f.row, data, errs); continue; }
    if (f.set) { validateFields(f.fields, data, errs); continue; }
    const v = data[f.k];
    if (f.req && (v === '' || v == null)) errs.push(`«${f.l}» fehlt.`);
    if ((f.type === 'int' || f.type === 'num') && v !== '' && v != null) {
      if (Number.isNaN(+v)) errs.push(`«${f.l}» muss eine Zahl sein.`);
      if (f.min != null && v < f.min) errs.push(`«${f.l}»: mindestens ${f.min}.`);
      if (f.max != null && v > f.max) errs.push(`«${f.l}»: höchstens ${f.max}.`);
    }
  }
}

async function compress(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const max = 1800, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.84));
    return b || file;
  } catch { return file; }
}
async function storeFile(file, meta) {
  const blob = await compress(file);
  const blobId = uid();
  await S.putBlob(blobId, blob);
  return S.save('media', { blobId, mime: blob.type || file.type || 'application/octet-stream', size: blob.size, name: file.name || '', origin: Device.id, takenAt: meta.takenAt || localDate(), ...meta });
}

async function submitMain(formEl) {
  const def = FORMS[form.type], fd = new FormData(formEl), d = { ...form.data };
  const defs = def.fields(d);
  readFields(defs, fd, d);
  const errs = []; validateFields(defs, d, errs);
  if (form.type === 'task' && d.repeat === 'every' && !(+d.everyN >= 1)) errs.push('Bitte angeben, alle wie viele Tage.');
  if (form.type === 'photo' && !d.id && !(form.files.files || []).length) errs.push('Bitte mindestens eine Datei wählen.');
  if (form.type === 'med' && d.end && d.end < d.start) errs.push('Das Ende liegt vor dem Beginn.');
  for (const fl of Object.values(form.files).flat()) if (fl.size > 50 * 1024 * 1024) errs.push(`${fl.name} ist grösser als 50 MB.`);
  if (form.type === 'weight' && d.animalId && d.at && S.list('weights').some((w) => w.id !== d.id && w.animalId === d.animalId && String(w.at).slice(0, 16) === String(d.at).slice(0, 16))) errs.push('Für dieses Tier ist zu genau diesem Zeitpunkt schon ein Gewicht erfasst.');
  if (errs.length) { const e = $('#form-err'); e.textContent = errs.join(' '); e.hidden = false; return; }
  const curRec = d.id ? S.recs.get(def.tbl + ':' + d.id) : null;
  if (curRec && form.baseVV && JSON.stringify(curRec.vv) !== form.baseVV && !form.overwriteOk) {
    form.overwriteOk = true; const e = $('#form-err'); e.textContent = 'Dieser Eintrag wurde inzwischen auf einem anderen Gerät geändert. «Speichern» überschreibt diese Änderung; die andere Version bleibt unter «Cloud und Synchronisierung → Gleichzeitige Änderungen» erhalten.'; e.hidden = false;
    formEl.querySelector('button[type=submit]').textContent = 'Trotzdem speichern'; return;
  }
  if (curRec && form.overwriteOk && !curRec.deleted) await S.save('conflicts', { tbl: def.tbl, recId: d.id, at: Date.now(), keptBy: Device.id, keptAt: Date.now(), lostBy: curRec.by, lostAt: curRec.updatedAt, lost: curRec.data, resolved: false });
  const btn = formEl.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Speichert …';
  try {
    if (form.type === 'expense') d.items = form.items.filter((i) => i.d || i.a).map((i) => ({ d: String(i.d || ''), a: i.a === '' ? '' : +i.a }));
    if (!d.id) d.id = uid();
    if (form.type === 'animal' && form.files.photo?.[0]) { const m = await storeFile(form.files.photo[0], { animalId: d.id, entity: 'animal', entityId: d.id, caption: 'Profilfoto' }); d.photoMedia = m.id; }
    if (form.type === 'expense' && form.files.receipt?.[0]) { const m = await storeFile(form.files.receipt[0], { entity: 'expense', entityId: d.id, caption: 'Beleg ' + (d.merchant || ''), takenAt: d.date }); d.receiptMedia = m.id; }
    if (form.type === 'photo' && !form.data.id) {
      for (const fl of form.files.files || []) await storeFile(fl, { animalId: d.animalId || '', caption: d.caption, takenAt: d.takenAt });
      closeSheet(); toast('Gespeichert'); render(); return;
    }
    if (form.files.media?.length) for (const fl of form.files.media) await storeFile(fl, { animalId: d.animalId || '', entity: def.fields(d).find((f) => f.type === 'media')?.entity || form.type, entityId: d.id, takenAt: String(d.at || localDate()).slice(0, 10), caption: d.title || d.reason || '' });
    await S.save(def.tbl, d);
    closeSheet();
    const extra = form.type === 'weight' ? weightFeedback(d) : '';
    toast(extra || 'Gespeichert');
    if (form.type === 'animal' && !form.data.id) go('tier-' + d.id); else render();
  } catch (e) { btn.disabled = false; btn.textContent = 'Speichern'; const er = $('#form-err'); er.textContent = 'Speichern fehlgeschlagen: ' + (e.message || e); er.hidden = false; }
}
function weightFeedback(w) {
  const a = S.get('animals', w.animalId); if (!a) return '';
  const st = weightStatus(a);
  if (st.level === 'crit') return `Gespeichert. Achtung: deutlicher Gewichtsverlust bei ${a.name} – siehe Übersicht.`;
  if (st.level === 'warn') return `Gespeichert. ${a.name} hat abgenommen – bitte beobachten.`;
  return `Gespeichert: ${a.name} ${w.g} g`;
}

const DL = { api: null, async init() { try { if (window.claude?.use) this.api = await window.claude.use('downloads'); } catch {} } };
async function saveFile(filename, data) {

    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith('.pdf') ? 'application/pdf' : 'application/json' });
    try {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') { toast('Abgebrochen'); return false; } }

const blobToDataURL = (b) => new Promise((r, j) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => j(fr.error); fr.readAsDataURL(b); });

async function logWeather() {

  }

// ---------------- Verschlüsselte Sicherung ----------------
const b64 = { enc(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }, dec(str) { const s = atob(str); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; } };
const ITER = 310000;
function dataUrlToBlob(u) { const [h, d] = String(u).split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream'; return new Blob([b64.dec(d)], { type: mime }); }
async function keyFrom(pw, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function makeBackup(pw) {
  const blobs = {};
  const used = new Set(S.list('media').map((m) => m.blobId));
  for (const id of await S.allBlobIds()) { if (!used.has(id)) continue; const b = await S.getBlob(id); if (b) blobs[id] = await blobToDataURL(b); }
  const payload = JSON.stringify({ format: 'kavia-data', v: 1, exportedAt: new Date().toISOString(), records: [...S.recs.values()], blobs });
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await keyFrom(pw, salt), new TextEncoder().encode(payload));
  return JSON.stringify({ format: 'kavia-backup', v: 1, cipher: 'AES-256-GCM', kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(ct) });
}
async function restoreBackup(text, pw) {
  let f; try { f = JSON.parse(text); } catch { throw new Error('Das ist keine Sicherungsdatei dieser App.'); }
  if (f.format === 'mm-backup') { const d = await Backup.decryptFile(f, pw); const r = await S.importRecords(d.records, 'merge'); return r; }
  if (f.format !== 'kavia-backup') throw new Error('Das ist keine Sicherungsdatei dieser App.');
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(f.iv) }, await (async () => { const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64.dec(f.salt), iterations: f.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })(), b64.dec(f.data)); }
  catch { throw new Error('Passwort falsch oder Datei beschädigt.'); }
  const data = JSON.parse(new TextDecoder().decode(plain));
  for (const [id, url] of Object.entries(data.blobs || {})) { if (await S.getBlob(id)) continue; await S.putBlob(id, dataUrlToBlob(url)); }
  const r = await S.importRecords(data.records || [], 'merge');
  return { added: r.added, updated: r.updated };
}

  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'sheet') closeSheet(); return; }
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault(); Promise.resolve(fn(el.dataset, el)).catch((err) => toast('Fehler: ' + (err.message || err)));
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('circle[data-act], rect[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.file) {
    const files = [...el.files]; form.files[el.dataset.file] = files;
    const prev = document.getElementById('prev-' + el.dataset.file);
    if (prev) prev.innerHTML = files.map((f) => f.type.startsWith('image') ? `<img src="${URL.createObjectURL(f)}" alt="">` : f.type.startsWith('video') ? `<video src="${URL.createObjectURL(f)}" muted></video>` : `<span class="pill info">${esc(f.name)}</span>`).join('');
    if (el.dataset.file === 'receipt' && OCR.ok) $('#ocr-msg').textContent = 'Foto gewählt. Jetzt «Beleg automatisch auslesen» tippen oder Angaben selbst eintragen.';
  }
  if (el.matches('#mainform [name="animalId"]') && form.type === 'journal') { keepValues(() => drawForm()); }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  try {
    if (kind === 'main') return await submitMain(f);
    if (['weightAll', 'pdf', 'archive', 'wipe'].includes(kind)) return await submitSpecial(kind, f);
    const fd = new FormData(f);
    if (kind === 'thresholds') { const p = {}; for (const k of ['warnPct', 'alarmPct', 'drop24', 'checkDays', 'tempHigh', 'tempLow', 'humHigh', 'humLow']) { const v = +fd.get(k); if (!Number.isNaN(v)) p[k] = v; } await saveSettings(p); toast('Gespeichert'); render(); }
    if (kind === 'wxsearch') { const q = String(fd.get('q') || '').trim(); if (!q) return; const box = $('#wx-results'); box.innerHTML = '<p class="muted">Suche …</p>'; try { const res = await WX.geocode(q); WX._results = res; box.innerHTML = res.length ? res.map((r, i) => `<div class="item click" data-act="wxpick" data-i="${i}"><div><div class="t">${esc(r.name)}</div><div class="meta">${esc([r.postcodes?.[0], r.admin2, r.admin1].filter(Boolean).join(' · '))}</div></div></div>`).join('') : '<p class="muted">Kein Ort gefunden. Versuchen Sie den Ortsnamen ohne Postleitzahl.</p>'; } catch (err) { box.innerHTML = `<p class="muted">${esc(err.message)}</p>`; } return; }
    if (kind === 'wxthr') { const p = {}; for (const k of ['wxGust', 'wxRain', 'wxHeat', 'wxFrost']) { const v = +fd.get(k); if (!Number.isNaN(v)) p[k] = v; } await saveSettings(p); toast('Gespeichert'); render(); }
    if (kind === 'weather') { await saveSettings({ weatherPlace: String(fd.get('place') || '').trim() }); toast('Ort gespeichert'); }
    if (kind === 'clientid') {
      const id = String(fd.get('clientId') || '').trim();
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) return toast('Die Client-ID hat das Format xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.');
      Auth.setCfg({ clientId: id, authority: String(fd.get('authority') || 'consumers') }); Auth.lastError = ''; toast('Gespeichert'); render(); return;
    }
    if (kind === 'bkpw') {
      const pw = String(fd.get('pw') || ''), pw2 = fd.get('pw2'), er = $('#bk-err');
      if (pw2 != null && pw !== String(pw2)) { er.textContent = 'Die Passwörter stimmen nicht überein.'; er.hidden = false; return; }
      const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Prüfe …';
      try { const r = await Backup.setup(pw); ui.cloud.keyState = 'ready'; Cloud.st.backupKeyState = 'ready'; Cloud.st.lastBackupCheck = 0; Cloud.saveState(); toast(r === 'created' ? 'Backup-Passwort festgelegt. Erstes Backup folgt.' : 'Passwort bestätigt'); Cloud.syncNow().then(render); render(); }
      catch (err) { er.textContent = err.message; er.hidden = false; btn.disabled = false; btn.textContent = 'Erneut versuchen'; }
      return;
    }
    if (kind === 'cloudrestore') return await submitRestore(f, fd);
    if (kind === 'pi') { await saveSettings({ piUrl: String(fd.get('piUrl') || '').trim() }); toast('Gemerkt'); }
    if (kind === 'backup') {
      const pw = String(fd.get('pw')), pw2 = String(fd.get('pw2'));
      if (pw.length < 8) return toast('Passwort: mindestens 8 Zeichen.');
      if (pw !== pw2) return toast('Die Passwörter stimmen nicht überein.');
      const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Verschlüssle …';
      try { const data = await makeBackup(pw); if (await saveFile(`Meerschweinchen-Sicherung ${localDate()}.json`, data)) { await saveSettings({ lastBackupAt: Date.now() }); toast('Sicherung erstellt'); render(); } }
      finally { btn.disabled = false; btn.innerHTML = icon('lock') + 'Verschlüsselte Sicherung erstellen'; }
    }
    if (kind === 'restore') {
      const file = fd.get('file'); if (!file || !file.size) return toast('Bitte eine Sicherungsdatei wählen.');
      const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Entschlüssle …';
      try { const r = await restoreBackup(await file.text(), String(fd.get('pw'))); toast(`Sicherung geladen: ${r.added} neu, ${r.updated} aktualisiert`); render(); }
      catch (err) { toast(err.message); } finally { btn.disabled = false; btn.textContent = 'Sicherung laden und zusammenführen'; }
    }
  } catch (err) { toast('Fehler: ' + (err.message || err)); }
});
let qT; $('#q').addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { ui.q = e.target.value; render(); }, 200); });
window.addEventListener('hashchange', () => { closeSheet(); render(); });

// ---------------- Start ----------------
(async () => {
  $('#footart').innerHTML = pigArt(true);
  render();
  await S.open();
  applyTheme();
  render();
  OCR.init(); DL.init();
  Cloud.on(() => { updateSyncPill(); if (route() === 'cloud' && !typingInView() && $('#sheet').hidden) render(); });
  window.addEventListener('hashchange', () => { if (route() === 'cloud') refreshCloudInfo(); });
  const res = await Cloud.init();
  if (res?.ok) { toast('Mit OneDrive verbunden. Ordner werden angelegt …'); go('cloud'); refreshCloudInfo(true); }
  else if (res?.error) { go('cloud'); }
  else if (route() === 'cloud') refreshCloudInfo();
  setInterval(updateSyncPill, 30000);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !navigator.serviceWorker.controller) return; reloaded = true; toast('Neue Version installiert', { label: 'Neu laden', fn: () => location.reload() }); });
  }
  if (STANDALONE) {
    WX.restore(); render();
    WX.load().then(() => { logWeather().catch(() => {}); render(); });
    setInterval(() => { if (document.visibilityState === 'visible') WX.load().then(() => { logWeather().catch(() => {}); render(); }); }, 30 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') WX.load().then(render); });
  }
})();
</script>
